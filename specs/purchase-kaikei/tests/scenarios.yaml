# tests/scenarios.yaml — auto-generated by stride_init_feature, filled from spec.md (v2)
feature_id: FEAT-PURCHASEKAIKEI
scenarios:
  - id: TS-UNIT-PURCHASEKAIKEI-001
    title: store 遷移ガード + 部門検証 + 仕訳対応表（unit）
    layer: unit
    spec_refs: [AC-US-PURCHASEKAIKEI-001-02, AC-US-PURCHASEKAIKEI-003-01, AC-US-PURCHASEKAIKEI-005-02]
    given: 任意の状態の申請
    when: 許可されていない遷移アクションを実行 / 部門不正で登録 / 仕訳明細を構築
    then: エラーになり状態が変わらない。対応表は仕様どおり
    expected:
      - 不正遷移はすべて拒否される
      - 部門は D10/D20/D90 のみ（既定 D90）
      - 検収仕訳 = 借 5110 / 貸 2110・支払仕訳 = 借 2110 / 貸 1120
  - id: TS-UNIT-PURCHASEKAIKEI-002
    title: 内蔵会計エンジン（unit）
    layer: unit
    spec_refs: [AC-US-PURCHASEKAIKEI-006-01, AC-US-PURCHASEKAIKEI-006-02]
    given: 任意の仕訳台帳
    when: 試算表・総勘定元帳を計算
    then: 全科目（残高 0 含む）が貸借一致で返り、元帳は日付順・残高繰越
    expected:
      - 借方合計 = 貸方合計
      - 部門・期間フィルタが効く
  - id: TS-INT-PURCHASEKAIKEI-001
    title: 申請登録（部門含む）→一覧照会
    layer: integration
    spec_refs: [AC-US-PURCHASEKAIKEI-001-01, AC-US-PURCHASEKAIKEI-001-02]
    given: 必須項目が入力された申請
    when: POST /api/purchases を呼ぶ
    then: 状態=submitted で登録され、一覧に表示される
    expected:
      - 201 応答・department は指定値または D90
  - id: TS-INT-PURCHASEKAIKEI-002
    title: 承認/却下/再申請
    layer: integration
    spec_refs: [AC-US-PURCHASEKAIKEI-002-01, AC-US-PURCHASEKAIKEI-002-02, AC-US-PURCHASEKAIKEI-002-03]
    given: submitted の申請
    when: approve / reject / resubmit を呼ぶ
    then: 状態が遷移し履歴が記録される（却下は comment 必須）
    expected:
      - approve → approved
      - reject without comment → 400
      - resubmit → submitted（履歴保持）
  - id: TS-INT-PURCHASEKAIKEI-003
    title: 発注
    layer: integration
    spec_refs: [AC-US-PURCHASEKAIKEI-003-01]
    given: approved の申請
    when: order を呼ぶ
    then: 状態=ordered、発注番号採番。非 approved は 409
    expected:
      - orderNo が採番される
      - submitted への order は 409
  - id: TS-INT-PURCHASEKAIKEI-004
    title: 分割検収 → 支払予定計上 + 仕訳自動計上
    layer: integration
    spec_refs: [AC-US-PURCHASEKAIKEI-004-01, AC-US-PURCHASEKAIKEI-004-03, AC-US-PURCHASEKAIKEI-005-01]
    given: ordered の申請
    when: receive を 2 回に分けて呼ぶ
    then: 各検収で支払予定 1 件 + 仕訳 1 件（借 5110 / 貸 2110・department 引継）が計上される
    expected:
      - 検収ごとに entry id が purchase.journal に記録される
      - 残数量超は 400
  - id: TS-INT-PURCHASEKAIKEI-005
    title: 支払実行 → 仕訳自動計上・二重支払 409
    layer: integration
    spec_refs: [AC-US-PURCHASEKAIKEI-005-02, AC-US-PURCHASEKAIKEI-005-03]
    given: scheduled の支払予定
    when: pay を呼ぶ
    then: 仕訳（借 2110 / 貸 1120）が 1 件計上され、entry id を記録。2 重支払は 409
    expected:
      - payable.entryId が保存される
      - 再 pay は 409
  - id: TS-INT-PURCHASEKAIKEI-006
    title: 会計 API（購買操作の反映）
    layer: integration
    spec_refs: [AC-US-PURCHASEKAIKEI-006-01, AC-US-PURCHASEKAIKEI-006-02]
    given: 検収・支払済みの購買データ
    when: 試算表 / 元帳 / 科目一覧を照会
    then: 購買で計上した仕訳が反映される
    expected:
      - 試算表は 11 科目すべて（残高 0 含む）・貸借一致
      - 元帳に購買検収・購買支払の行がある
  - id: TS-INT-PURCHASEKAIKEI-007
    title: ミラー連携（Outbox）— 成功・障害・再送
    layer: integration
    spec_refs: [AC-US-PURCHASEKAIKEI-007-01, AC-US-PURCHASEKAIKEI-007-02]
    given: 検収・支払を行った購買データ
    when: kaikei-api が稼働中 / 停止 / 復帰の各状態で同期する
    then: 稼働中は自動ミラー・停止中はキュー保持で操作可能・復帰後は再送で取り込まれる
    expected:
      - 同期済み仕訳に kaikeiEntryId が記録される
      - 未同期件数が status/sync API で見える
  - id: TS-E2E-PURCHASEKAIKEI-001
    title: 購買会計フロー完走（クリティカルジャーニー）
    layer: e2e
    spec_refs: [AC-US-PURCHASEKAIKEI-001-01, AC-US-PURCHASEKAIKEI-004-03, AC-US-PURCHASEKAIKEI-005-03, AC-US-PURCHASEKAIKEI-006-01, AC-US-PURCHASEKAIKEI-006-02]
    given: 空のデータファイル
    when: 申請→承認→発注→分割検収→支払→試算表/元帳照会を順に実行
    then: 全遷移が成功し、仕訳が検収回数+支払回数だけ計上される
    expected:
      - 最終状態 = paid・全 payable に entryId
      - 試算表・元帳で計上した仕訳が確認できる
      - 再起後も entry id を含むデータが残る（NFR-002）
